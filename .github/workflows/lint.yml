name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pylint
          pip install -r requirements.txt
          pip install -e '.[test]'

      - name: Run tests
        run: pytest -q

      - name: Build and smoke-test wheel
        run: |
          python -m build
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "import mcp_server, mcp_tools"
          "$RUNNER_TEMP/wheel-smoke/bin/zebbern-kali-mcp" --help

      - name: Run Pylint on server code
        run: pylint --rcfile=.pylintrc --fail-under=5.0 zebbern-kali/

      - name: Run Pylint on MCP client code
        run: pylint --rcfile=.pylintrc --fail-under=5.0 mcp_tools/ mcp_server.py
