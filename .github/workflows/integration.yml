name: Integration

# The release pipeline previously ran only mocked tests: `pytest -q` skips the
# live suite when no backend answers, so every published version shipped with
# no automated proof that a single tool executes. This job supplies that proof
# and gates publishing on it.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/integration.yml'
      - 'tests/integration/**'
      - 'tests/test_live_tools.py'
      - 'mcp_tools/**'
      - 'docker-compose*.yml'

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned digest, not a floating tag, so the gate is reproducible and cannot
  # race a concurrent docker-publish. Re-pin as a release-prep step when the
  # certified image changes: resolve the published tag with
  # `docker buildx imagetools inspect <image>:<tag>` and take its top-level
  # Digest. A stale pin means the gate certifies an older image than the
  # published tag serves, so re-pin next to the version bump.
  IMAGE: ghcr.io/zebbern/zebbern-kali-mcp@sha256:702896ecd60dd57cfe9497c36a943d1c7cf6e9f7b914955e27b9d01f5cdf1287

jobs:
  integration:
    name: Container smoke and live tools
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Free disk space for the Kali image
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          echo "after cleanup:"; df -h / | tail -1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published image
        run: |
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'pulled {{.RepoTags}} created {{.Created}}'
          df -h / | tail -1

      - name: Container smoke with trim-profile assertion
        run: |
          # Assert the pinned digest reports the version the tree declares.
          # The pin is hand-maintained and has drifted three times; without
          # this the gate happily certifies a stale image, since an older
          # build has the same tool surface and passes every other check.
          VERSION="$(python .github/scripts/verify_release_artifacts.py declared-version)"
          python tests/integration/run_smoke.py \
            --image "$IMAGE" \
            --network-mode bridge \
            --expect-variant full \
            --check-trim \
            --expect-version "$VERSION"

      - name: Start a backend for the live suite
        env:
          # Same pinned digest the smoke layer certified. A digest pull leaves no
          # local tag, so without this compose would not find :latest and would
          # rebuild the image from the Dockerfile.
          ZKM_IMAGE: ${{ env.IMAGE }}
        run: |
          docker compose config --images
          docker compose up -d
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5000/live >/dev/null; then
              echo "backend live"; exit 0
            fi
            sleep 5
          done
          echo "backend never became live"; docker compose logs --tail 50; exit 1

      - name: Live tool execution
        env:
          KALI_API_URL: http://127.0.0.1:5000
        run: pytest -m live -v

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
