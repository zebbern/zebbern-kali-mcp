[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zebbern-kali-mcp"
version = "1.0.7"
description = "Capability-aware MCP client for a Docker-hosted Kali Linux tools API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Zebbern"},
]
keywords = ["mcp", "kali", "security", "pentest", "ai-agent", "copilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.28,<2",
    "requests>=2.28.0",
]

[project.optional-dependencies]
test = [
    "Flask>=2.3,<4",
    "pytest>=8,<9",
]

[project.urls]
Homepage = "https://github.com/zebbern/zebbern-kali-mcp"
Documentation = "https://github.com/zebbern/zebbern-kali-mcp#readme"
Repository = "https://github.com/zebbern/zebbern-kali-mcp"
Issues = "https://github.com/zebbern/zebbern-kali-mcp/issues"

[project.scripts]
zebbern-kali-mcp = "mcp_server:main"

[tool.pytest.ini_options]
markers = [
    "live: exercises a running Kali backend; skipped when none answers",
]

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.setuptools.packages.find]
include = ["mcp_tools*"]
